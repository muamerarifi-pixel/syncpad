<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Deep obsidian radial background with tactile depth -->
    <radialGradient id="bgGrad192" cx="28%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#242c3d"/>
      <stop offset="45%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Metallic silver gradient for sleek precision -->
    <linearGradient id="silverGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Subtle cyan-blue core glow -->
    <linearGradient id="glowGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="depthShadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="softGlow192" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle with subtle beveled border -->
  <rect x="10" y="10" width="172" height="172" rx="46" fill="url(#bgGrad192)" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>
  <rect x="12" y="12" width="168" height="168" rx="44" fill="none" stroke="rgba(0,0,0,0.85)" stroke-width="2"/>

  <!-- Minimalist Interlocking Dual-Arc Sync Emblem with Depth -->
  <g filter="url(#depthShadow192)">
    <!-- Top sync loop -->
    <path d="M 68 87 C 68 60, 117 57, 129 75 C 135 84, 129 96, 114 96 C 96 96, 84 102, 81 114" 
          fill="none" stroke="url(#silverGrad192)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom sync loop counter-flow -->
    <path d="M 124 105 C 124 132, 75 135, 63 117 C 57 108, 63 96, 78 96 C 96 96, 108 90, 111 78" 
          fill="none" stroke="url(#silverGrad192)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic focal sync beads with subtle glow -->
    <circle cx="129" cy="75" r="8" fill="url(#glowGrad192)" filter="url(#softGlow192)"/>
    <circle cx="63" cy="117" r="8" fill="url(#glowGrad192)" filter="url(#softGlow192)"/>
  </g>
</svg>
