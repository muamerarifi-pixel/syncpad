<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="sp-bg" x1="64" y1="16" x2="448" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15392C"/>
      <stop offset="45%" stop-color="#081C15"/>
      <stop offset="100%" stop-color="#020A07"/>
    </linearGradient>
    <radialGradient id="sp-aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 266) scale(238 188)">
      <stop offset="0%" stop-color="#1BE896" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#0B8A57" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#020A07" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-top-lift" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(152 76) rotate(32) scale(264 174)">
      <stop offset="0%" stop-color="#7AF5C4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7AF5C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(384 416) scale(310)">
      <stop offset="0%" stop-color="#010604" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#010604" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-rim" x1="44" y1="12" x2="468" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CEFEEA" stop-opacity="0.36"/>
      <stop offset="36%" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.48"/>
