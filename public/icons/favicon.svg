  <rect width="512" height="512" rx="118" fill="url(#sp-bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#sp-aura)"/>
  <rect width="512" height="512" rx="118" fill="url(#sp-top-lift)"/>
  <rect width="512" height="512" rx="118" fill="url(#sp-vignette)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" stroke="url(#sp-rim)" stroke-width="3"/>

  <g>
    <g filter="url(#sp-drop)">
