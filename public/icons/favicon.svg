    </linearGradient>
    <radialGradient id="sp-zenith" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(228 174) rotate(22) scale(136 104)">
      <stop offset="0%" stop-color="#EEFFF8" stop-opacity="0.54"/>
      <stop offset="56%" stop-color="#7AF5C4" stop-opacity="0.12"/>
