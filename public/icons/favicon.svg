        <path d="M 166.00 362.00 A 82 82 0 1 1 158.60 198.33 A 98 98 0 0 1 348.35 210.09 A 76 76 0 1 1 352.00 362.00 Z" fill="url(#sp-back)"/>
        <path d="M 166.00 362.00 A 82 82 0 1 1 158.60 198.33 A 98 98 0 0 1 348.35 210.09 A 76 76 0 1 1 352.00 362.00 Z" fill="url(#sp-zenith)"/>
        <path d="M 166.00 362.00 A 82 82 0 1 1 158.60 198.33 A 98 98 0 0 1 348.35 210.09 A 76 76 0 1 1 352.00 362.00 Z" fill="url(#sp-left-light)"/>
        <path d="M 348.35 210.09 C 304 232, 266 286, 248 362 L 440 362 L 440 190 L 348.35 210.09 Z" transform="translate(-15, -5)" fill="url(#sp-fold-shadow)" filter="url(#sp-soft-fold)"/>
        <path d="M 348.35 210.09 C 304 232, 266 286, 248 362 L 440 362 L 440 190 L 348.35 210.09 Z" fill="url(#sp-front)"/>
        <path d="M 348.35 210.09 C 304 232, 266 286, 248 362" stroke="url(#sp-fold-spec)" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="76" y="320" width="360" height="46" fill="url(#sp-base-bevel)"/>
        <path d="M 166.00 362.00 A 82 82 0 1 1 158.60 198.33 A 98 98 0 0 1 348.35 210.09 A 76 76 0 1 1 352.00 362.00 Z" stroke="url(#sp-top-rim)" stroke-width="3.2"/>
