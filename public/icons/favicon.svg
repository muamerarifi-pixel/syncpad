      <stop offset="62%" stop-color="#02291A" stop-opacity="0.24"/>
      <stop offset="92%" stop-color="#02291A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#02291A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sp-fold-spec" x1="346" y1="210" x2="248" y2="358" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="16%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="52%" stop-color="#C4FDE6" stop-opacity="0.28"/>
      <stop offset="86%" stop-color="#C4FDE6" stop-opacity="0"/>
