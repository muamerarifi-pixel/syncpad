<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep obsidian radial background with tactile depth -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="50%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <!-- Metallic silver gradient for sleek precision -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Subtle cyan-blue core glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="depthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle with subtle beveled border -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="1"/>

  <!-- Minimalist Interlocking Dual-Arc Sync Emblem with Depth -->
  <g filter="url(#depthShadow)">
    <!-- Top sync loop -->
    <path d="M 23 29 C 23 20, 39 19, 43 25 C 45 28, 43 32, 38 32 C 32 32, 28 34, 27 38" 
          fill="none" stroke="url(#silverGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom sync loop counter-flow -->
    <path d="M 41 35 C 41 44, 25 45, 21 39 C 19 36, 21 32, 26 32 C 32 32, 36 30, 37 26" 
          fill="none" stroke="url(#silverGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic focal sync beads with subtle glow -->
    <circle cx="43" cy="25" r="2.8" fill="url(#glowGrad)" filter="url(#softGlow)"/>
    <circle cx="21" cy="39" r="2.8" fill="url(#glowGrad)" filter="url(#softGlow)"/>
  </g>
</svg>
