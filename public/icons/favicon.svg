    <linearGradient id="sp-front" x1="342" y1="208" x2="334" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B0FDE0"/>
      <stop offset="26%" stop-color="#40E6A3"/>
      <stop offset="72%" stop-color="#0FAE6F"/>
