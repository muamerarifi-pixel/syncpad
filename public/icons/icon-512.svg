<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian radial background with tactile depth -->
    <radialGradient id="bgGrad512" cx="28%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#242c3d"/>
      <stop offset="45%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Metallic silver gradient for sleek precision -->
    <linearGradient id="silverGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Subtle cyan-blue core glow -->
    <linearGradient id="glowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="depthShadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="softGlow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle with subtle beveled border -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad512)" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>
  <rect x="30" y="30" width="452" height="452" rx="114" fill="none" stroke="rgba(0,0,0,0.85)" stroke-width="5"/>

  <!-- Minimalist Interlocking Dual-Arc Sync Emblem with Depth -->
  <g filter="url(#depthShadow512)">
    <!-- Top sync loop -->
    <path d="M 182 232 C 182 160, 312 152, 344 200 C 360 224, 344 256, 304 256 C 256 256, 224 272, 216 304" 
          fill="none" stroke="url(#silverGrad512)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom sync loop counter-flow -->
    <path d="M 330 280 C 330 352, 200 360, 168 312 C 152 288, 168 256, 208 256 C 256 256, 288 240, 296 208" 
          fill="none" stroke="url(#silverGrad512)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic focal sync beads with subtle glow -->
    <circle cx="344" cy="200" r="22" fill="url(#glowGrad512)" filter="url(#softGlow512)"/>
    <circle cx="168" cy="312" r="22" fill="url(#glowGrad512)" filter="url(#softGlow512)"/>
  </g>
</svg>
